services:
  - type: web
    name: ibrahimvipzone
    runtime: node
    plan: free
    region: singapore
    rootDir: .
    buildCommand: npm install && npm run build
    startCommand: npm run db:push && npm start
    healthCheckPath: /api/health

    envVars:
      - key: NODE_VERSION
        value: "20"

      - key: COOKIE_SECURE
        value: "true"

      - key: ADMIN_EMAIL
        sync: false

      - key: ADMIN_PASSWORD
        sync: false

      - key: ADMIN_NAME
        sync: false

      - key: ADMIN_PHONE
        sync: false

      - key: OPENAI_API_KEY
        sync: false

      - key: OPENAI_MODEL
        sync: false

      - key: AI_API_KEY
        sync: false

      - key: AI_BASE_URL
        sync: false

      - key: AI_MODEL
        sync: false

      - key: DATABASE_URL
        fromDatabase:
          name: ibrahimvipzone-db
          property: connectionString

databases:
  - name: ibrahimvipzone-db
    plan: free
    region: singapore
